[project]
name = "launchkit"
version = "0.1.0"
description = "LaunchKit: a marketing assistant built in steps. Opener (one LLM call, LangGraph), then the agent harness on Agno"
requires-python = ">=3.12"
dependencies = [
    "agno[openai,sqlite]==3.1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
launchkit = "launchkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchkit"]

[tool.pytest.ini_options]
testpaths = ["checks"]
addopts = "-p no:cacheprovider"
