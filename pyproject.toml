[project]
name = "launchkit"
version = "0.1.0"
description = "LaunchKit: a marketing assistant built in steps. Opener (one LLM call, LangGraph), then the agent harness on Agno"
requires-python = ">=3.12"
dependencies = [
    "agno[openai,sqlite]==3.1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=3.0",
    "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel Macs: torch 2.2.2 is the last release with an Intel-Mac build, and it needs numpy 1.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "lancedb>=0.25; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel Macs: lancedb 0.25.3 is the last release with an Intel-Mac build. The newer embedding stack and pyarrow
    # need torch 2.6 or numpy 2, so Intel Macs keep the last versions that work with torch 2.2.2 and numpy 1.
    "lancedb==0.25.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pyarrow<26; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "mcp>=1.20,<2",
]

[project.scripts]
launchkit = "launchkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# The embedding model runs on the laptop CPU. On Linux and Windows the default torch wheel bundles CUDA (gigabytes);
# the CPU index keeps the install small. macOS wheels are CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Lock for every laptop a participant may bring, Intel Macs included, so uv sync never has to re-resolve.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchkit"]

[tool.pytest.ini_options]
testpaths = ["checks"]
addopts = "-p no:cacheprovider"
markers = [
    "stage1: Session 4, stage 1: the file tools in a workspace per conversation",
    "stage2: Session 4, stage 2: a capped search",
    "stage3: Session 4, stage 3: one check every path passes",
    "stage4: Session 4, stage 4: an edit tool",
    "stage5: Session 4, stage 5: the artifact record",
    "stage6: Session 4, stage 6: shared files, a discussion with no build",
    "ticket: Session 4, the ticket after shipping: five writers, four entries lost",
]
