- {text: "Maya trusts hiking forums over listicles for trends.", kind: preference, topic: research, author: maya, scope: user}
- {text: "Copy says 'bottle', never 'flask', in headlines.", kind: correction, topic: wording, author: maya, scope: workspace}
- {text: "Say 'cold for 24 hours', not 'ice cold all day'.", kind: correction, topic: wording, author: maya, scope: workspace}
- {text: "Sam spells colour the British way.", kind: correction, topic: wording, author: sam, scope: workspace}
- {text: "Maya is out on Fridays; approvals wait until Monday.", kind: domain fact, topic: availability, author: maya, scope: workspace}
- {text: "Sam's internship ends in March.", kind: domain fact, topic: availability, author: sam, scope: user}
